# เว็บจริง deploy ผ่าน Netlify แล้ว workflow นี้เหลือหน้าที่ตรวจข้อมูลการ์ดและ engine ทุกครั้งที่ push
name: CI

on:
  push:
    branches: [main, claude/modest-franklin-7f7fsf]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate cards
        run: node tools/validate-cards.js
      - name: Smoke test engine
        run: node tools/smoke.js 1000
      - name: Install function dependencies
        run: npm ci
      - name: Function loads
        run: node -e "import('./netlify/functions/life-story.mjs').then(m => { if (typeof m.default !== 'function') process.exit(1); })"
